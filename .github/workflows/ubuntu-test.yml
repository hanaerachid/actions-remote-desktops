# This is a basic workflow to help you get started with Actions

name: Ubuntu Remote Virtual Machine

# Controls when the workflow will run
on:
  workflow_dispatch:
    inputs:
      auth:
        description: 'Google Remote Desktop Command'
        default: ''
        required: true

      pin:
        description: 'PIN'
        default: '123456'
        required: true

      vscode:
        description: 'Install VSCode?'
        default: true
        required: false
        type: boolean

defaults:
  run:
    shell: bash
# A workflow run is made up of one or more jobs that can run sequentially or in parallel
jobs:
  # This workflow contains a single job called "build"
  build:
    # The type of runner that the job will run on
    runs-on: ubuntu-latest
    name: 'Set up a Ubuntu machine'
    # Steps represent a sequence of tasks that will be executed as part of the job

    steps:
    # Checks-out your repository under $GITHUB_WORKSPACE, so your job can access it
    - name: Check out repository code
      uses: actions/checkout@v3

    - name: Add User
      run: |
        sudo useradd -m brooke
        sudo adduser brooke sudo
        echo 'brooke:Jacobs123' | sudo chpasswd
        sudo sed -i 's/\/bin\/sh/\/bin\/bash/g' /etc/passwd
      continue-on-error: true

    - name: Install Google chrome
      shell: bash
      run: |
        curl https://dl.google.com/linux/linux_signing_key.pub | sudo gpg --dearmor -o /etc/apt/trusted.gpg.d/chrome-remote-desktop.gpg
        echo "deb [arch=amd64 signed-by=/usr/share/keyrings/google-chrome.gpg] https://dl.google.com/linux/chrome/deb/ stable main" | sudo tee /etc/apt/sources.list.d/google-chrome.list
        sudo apt update
        sudo DEBIAN_FRONTEND=noninteractive sudo apt install google-chrome-stable
      continue-on-error: true

    - name: Install RD
      shell: bash
      run: |
        curl https://dl.google.com/linux/linux_signing_key.pub | sudo gpg --dearmor -o /etc/apt/trusted.gpg.d/chrome-remote-desktop.gpg
        echo "deb [arch=amd64] https://dl.google.com/linux/chrome-remote-desktop/deb stable main" | sudo tee /etc/apt/sources.list.d/chrome-remote-desktop.list
        sudo apt update
        sudo DEBIAN_FRONTEND=noninteractive apt install --assume-yes chrome-remote-desktop
      continue-on-error: true

    - name: Install XFCE
      shell: bash
      run: |
        sudo apt-get clean
        sudo rm -rf /var/lib/apt/lists/*
        sudo apt-get update
        sudo DEBIAN_FRONTEND=noninteractive apt-get \
          -o Acquire::Retries=3 \
          --fix-broken install -y
        sudo DEBIAN_FRONTEND=noninteractive apt install --assume-yes xfce4 desktop-base dbus-x11 xscreensaver
        sudo bash -c 'echo "exec /etc/X11/Xsession /usr/bin/xfce4-session" > /etc/chrome-remote-desktop-session'
        sudo systemctl disable lightdm.service
      continue-on-error: true

    - name: Run RD command
      run: "${{ github.event.inputs.auth }} --pin=${{ github.event.inputs.pin }}"
      continue-on-error: true

    - name: Install VSCode
      if: ${{ github.event.inputs.vscode == 'true' }}
      run: |
        sudo apt install wget gpg && wget -qO- https://packages.microsoft.com/keys/microsoft.asc | sudo gpg --dearmor -o /etc/apt/trusted.gpg.d/microsoft.gpg
        sudo add-apt-repository -y "deb [arch=amd64,arm64,armhf] https://packages.microsoft.com/repos/code stable main"
        sudo apt update && sudo apt install code

    - name: Add user to RD group
      shell: bash
      run: sudo adduser brooke chrome-remote-desktop
      continue-on-error: true

    - name: Setup TMATE session
      uses: mxschmitt/action-tmate@v3
      continue-on-error: true
